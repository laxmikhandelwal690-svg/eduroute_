services:
  api:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=eduroute_dev_password
      - MYSQL_DATABASE=eduroute
      - JWT_SECRET=supersecret
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: .
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: eduroute_dev_password
      MYSQL_DATABASE: eduroute
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-peduroute_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
